[project]
name = "oddsfox-catalogue"
version = "1.0.0"
description = "Local batch pipeline for an OddsFox catalogue of public Polymarket events."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.4,<2",
    "pytz>=2025.2",
    "httpx>=0.27",
    "filelock>=3.15",
]

[project.optional-dependencies]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3",
    "ruff>=0.6",
]

[project.scripts]
catalogue = "oddsfox_catalogue.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
    "**/__pycache__/**", "**/dbt/target/**", "**/dbt/logs/**",
    "**/dbt/dbt_packages/**", "**/dbt/.user.yml", "**/data/**", "**/.state/**",
]
include = [
    "src/oddsfox_catalogue/**/*.py",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "src/oddsfox_catalogue/**/*.py",
    "pyproject.toml", "uv.lock", "README.md", "LICENSE",
    "config/catalogue.toml", "docs/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Line length is enforced by the formatter; long SQL literals are intentional.
ignore = ["E501"]
