[project]
name = "oddsfox-catalogue"
version = "0.1.0"
description = "Local batch pipeline for an OddsFox catalogue of public Polymarket events."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "dlt[duckdb]>=1.10",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
    "dagster>=1.10",
    "dagster-dbt>=0.26",
    "dagster-webserver>=1.10",
    "httpx>=0.27",
    "filelock>=3.15",
]

[project.optional-dependencies]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.scripts]
catalogue = "oddsfox_catalogue.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oddsfox_catalogue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120
markers = [
    "integration: exercises dlt/DuckDB/dbt together",
    "e2e: full pipeline run against the fake Gamma server",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Line length is enforced by the formatter; long SQL literals are intentional.
ignore = ["E501"]
