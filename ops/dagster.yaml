# Dagster instance settings. `make dagster-home` copies this file to $DAGSTER_HOME/dagster.yaml.
#
# QueuedRunCoordinator holds runs in a queue and starts at most one at a time, so scheduled
# daily and weekly runs can never overlap, even when a manual run is also requested.
run_coordinator:
  module: dagster._core.run_coordinator.queued_run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1
