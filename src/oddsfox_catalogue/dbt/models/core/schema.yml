version: 2

models:
  - name: events_current
    description: Authoritative whole observation for each event, keyed by venue and event_id.
    columns:
      - name: venue
        tests: [not_null]
      - name: event_id
        tests: [not_null]
      - name: observation_id
        tests: [unique, not_null]
      - name: built_through
        tests: [not_null]

  - name: markets_current
    description: Authoritative whole observation, selected by direct-source priority and receipt order.
    columns:
      - name: venue
        tests: [not_null]
      - name: market_id
        tests: [not_null]
      - name: observation_id
        tests: [unique, not_null]
      - name: built_through
        tests: [not_null]

  - name: int_market_outcomes
    description: Canonical outcome nominations with identity and ownership validation.
    columns:
      - name: usable
        tests: [not_null]

  - name: outcomes_current
    description: One row per outcome of each aligned current market.
    columns:
      - name: market_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('markets_current')
                field: market_id
      - name: outcome_index
        tests: [not_null]
    tests:
      - unique:
          arguments:
            column_name: "venue || '|' || market_id || '|' || outcome_index"

  - name: quarantine_market_outcomes
    description: Markets with misaligned outcome arrays. Unusable identities remain accounted in otherwise healthy releases.
    columns:
      - name: market_id
        tests: [not_null]

  - name: event_tags_current
    columns:
      - name: event_id
        tests:
          - relationships:
              arguments:
                to: ref('events_current')
                field: event_id

  - name: market_event_bridge
    columns:
      - name: market_id
        tests:
          - relationships:
              arguments:
                to: ref('markets_current')
                field: market_id
