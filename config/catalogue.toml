# Committed defaults for the OddsFox Polymarket catalogue pipeline.
#
# Every key can be overridden with an environment variable named
# CATALOGUE_<SECTION>_<KEY> (upper case), for example
# CATALOGUE_GAMMA_REQUESTS_PER_SECOND=1.5.
# Paths are relative to the project root unless absolute.

[gamma]
base_url = "https://gamma-api.polymarket.com"
requests_per_second = 2.0
# HTTP loopback servers are permitted only for explicit offline tests.
allow_loopback = false
connect_timeout_s = 10.0
read_timeout_s = 60.0
max_retries = 12
backoff_base_s = 5.0
backoff_cap_s = 300.0
page_limit = 100
# Optional expansions. Off by default because they enlarge payloads.
include_chat = false
include_template = false
include_best_lines = false

[paths]
data_dir = "data"
state_dir = ".state"
warehouse_file = "data/warehouse/catalogue.duckdb"
dbt_project_dir = ""
dbt_profiles_dir = ""

[load]
dataset_name = "bronze"
# Pages per dlt pipeline.run. Each chunk commits before the next starts.
max_pages_per_run = 200
duckdb_memory_limit = "2GB"
duckdb_threads = 2

[quality]
# Maximum share of a batch's records that may be quarantined. Above it the batch is not
# registered, so dbt never reads it, and refresh/replay stop before the build. A share exactly at
# the limit passes.
quarantine_max_ratio = 0.01
# Open-event drop versus the last valid published release, in percent. Drops from warn up to error are
# logged (the CLI stage row also records them); the build still passes. Above error, `dbt build`
# fails and nothing is published. Custom dbt variables cannot disable these checks.
open_events_drop_warn_pct = 5.0
open_events_drop_error_pct = 10.0

[schedule]
daily_cron = "0 6 * * 1-6"
weekly_cron = "0 3 * * 0"

[capture]
# Ids per id-range scan. Each scan still requests 100 ids at a time.
id_partition_size = 50000
# 0 uses the server high-water mark. A positive value caps a smoke run and skips the tail.
max_id_override = 0
# Scans from the same plan stage run together. They share the Gamma rate limit.
workers = 1

# One finite allowance per invocation, including planning, retries and follow-ups.
max_requests = 25000
max_download_bytes = 4294967296
max_duration_s = 14400.0
max_response_bytes = 16777216
max_retained_bytes = 68719476736
max_temp_bytes = 8589934592
