name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
      # Ordinary tests use in-process transports; installed workflow proof starts
      # its own bounded loopback fixture server. Neither uses live Gamma.
      CATALOGUE_GAMMA_BASE_URL: "http://127.0.0.1:9"
      CATALOGUE_GAMMA_ALLOW_LOOPBACK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: dbt parse
        run: uv run catalogue dbt -- parse

      - name: Complete offline test suite
        run: uv run --locked pytest -q

      - name: Audited installed package and full offline workflow
        env:
          UV_LINK_MODE: copy
        run: uv run --locked python scripts/verify-installed-workflow.py
